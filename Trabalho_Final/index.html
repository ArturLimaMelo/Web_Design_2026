<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alimentaê</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main">
        <header class="header">
            <div class="logo">
                <p><b>Alimentaê</b></p>
            </div>
            <div class="HeaderButtons">
                <button>Início</button>
                <button>Como funciona</button>
                <button>Parceiros</button>
                <button>Sobre nós</button>
            </div>
            <div class="DonateButton">
                <button>Quero doar -></button>
            </div>
        </header>
        <div class="body">
            <div class="bodyText">
                <div class="connect"><h5>CONECTANDO QUEM DOA A QUEM PRECISA EM NATAL/RN</h5></div>
                <br>
                <p><b>Comida boa não se joga fora. <span>Se compartilha.</span></b></p>
            </div>
            <div class="ImgSlider">
                <img src="./images/Vegetais.jfif">
            </div>
            <div class="Impact">
                <div class="NossoImpacto">NOSSO IMPACTO</div>

                <div class="ImpactNumber">
                    <h1>28.640</h1>
                    <span>kg</span>
                </div>

                <p class="ImpactDescription">
                    Alimentos que já ganharam um novo destino!
                </p>

                <div class="ImpactFooter">
                    <div class="ImpactPlus">+</div>
                    <span>Atualizado com cada nova doação</span>
                </div>
            </div>
            <div class="DonateNow">
                <div class="DonateText">
                    <span>FAÇA PARTE DESSA REDE</span>
                    <h2>Doar agora</h2>
                </div>

                <button class="DonateArrow">→</button>
            </div>
        </div>
        <div class="footer">
            <p>Footer</p>
        </div>
    </div>
</body>
</html>
